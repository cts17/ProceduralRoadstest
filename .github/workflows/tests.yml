name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # NEW JOB: Compiles the mod DLL and uploads it
  build-dll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Change "ProceduralRoads.csproj" to the actual name and path of your main mod project file
      - name: Build Mod DLL
        run: dotnet build ProceduralRoads/ProceduralRoads.csproj -c Release

      - name: Upload Mod DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProceduralRoads-Mod-DLL
          path: '**/bin/Release/**/*.dll'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ProceduralRoads.Tests/ProceduralRoads.Tests.csproj -c Release -f net10.0
      - run: dotnet test ProceduralRoads.SystemTests.Tests/ProceduralRoads.SystemTests.Tests.csproj -c Release

  net48:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install Mono
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mono-complete
          mono --version
      - run: bash tools/test-runners/run-tests.sh -c Release -f net48 ProceduralRoads.Tests/ProceduralRoads.Tests.csproj
